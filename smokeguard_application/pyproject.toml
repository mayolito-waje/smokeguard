[project]
name = "smokeguard"
version = "0.1.0"
description = "FastAPI backend for SmokeGuard Wi-Fi CSI smoke detection"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "paho-mqtt>=2.1.0",
    "influxdb-client>=1.48.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.4.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "pyarrow>=25.0.1",
    "tensorflow-cpu==2.21.0",
    "scikit-learn==1.6.1",
    "scipy>=1.14",
    "joblib>=1.4",
    "fpdf2>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
